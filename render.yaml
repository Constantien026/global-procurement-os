services:
  - type: web
    name: global-procurement-os
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # node:sqlite (used by db.js) is only unflagged from Node 24
      - key: NODE_VERSION
        value: 24.22.1
